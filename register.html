<!DOCTYPE html>
<html>
<head>
    <title>LocalHandy - Register Worker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .form-container {
            background: white;
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            background-color: #0056b3;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Worker Registration Form</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="workers.html">Find Workers & Chat</a>
        <a href="register.html">Register Worker</a>
    </nav>

    <div class="form-container">
        <h3>Join as a Service Provider</h3>
        <form>
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Select Profession:</label>
                <select required>
                    <option value="">-- Choose --</option>
                    <option value="carpenter">Carpenter</option>
                    <option value="plumber">Plumber</option>
                    <option value="painter">Painter</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone Number:</label>
                <input type="tel" placeholder="Enter mobile number" required>
            </div>

            <div class="form-group">
                <label>Visiting Charges (₹):</label>
                <input type="number" placeholder="e.g. 200">
            </div>

            <button type="submit" class="btn">Submit Details</button>
        </form>
    </div>

    <footer>
        <p>CSE 326 Internet Programming Project</p>
    </footer>

</body>
</html>
